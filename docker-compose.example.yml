services:
  orca:
    build: .
    image: orca-server:latest
    container_name: orca
    restart: unless-stopped
    init: false            # tini is already the entrypoint
    shm_size: "1gb"        # Chromium needs more than Docker's 64MB default
    ports:
      - "6768:6768"   # Orca server
      - "6769:6769"   # AI 팀 회의실 page
    environment:
      TZ: Asia/Seoul
      PUID: "1026"                      # `id` in DSM SSH → your uid
      PGID: "100"                       # usually 100 (users) on Synology
      ORCA_PORT: "6768"
      ORCA_PAIRING_ADDRESS: "100.x.y.z" # NAS Tailscale IP (Tailscale app → Machines)
      ORCA_PAIRING_MODE: "desktop"      # desktop | mobile | off
      MEETING_ROOM: "on"                # on | off  (AI 팀 회의실 at http://<tailscale-ip>:6769)
      MEETING_ROOM_TOKEN: ""            # optional: set a word, then open :6769/?token=<word>
    volumes:
      - /volume1/docker/orca/home:/home/orca       # Orca data, AI logins, git/ssh config
      - /volume1/docker/orca/workspace:/workspace  # your git projects
