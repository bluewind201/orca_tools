# Personal values come from .env next to this file (see .env.example). Defaults below match this NAS.
services:
  orca:
    build: .
    image: orca-server:latest
    container_name: orca
    restart: unless-stopped
    init: false            # tini is already the entrypoint
    shm_size: "1gb"        # Chromium needs more than Docker's 64MB default
    ports:
      - "6768:6768"   # Orca server
      - "6769:6769"   # AI 팀 회의실 page
    environment:
      TZ: Asia/Seoul
      PUID: "${PUID:-1026}"                                   # `id` in DSM SSH → uid
      PGID: "${PGID:-100}"                                    # `id` in DSM SSH → gid
      ORCA_PORT: "6768"
      ORCA_PAIRING_ADDRESS: "${ORCA_PAIRING_ADDRESS:-100.119.72.114}"  # NAS Tailscale IP
      ORCA_PAIRING_MODE: "${ORCA_PAIRING_MODE:-off}"          # desktop | mobile | off
      MEETING_ROOM: "${MEETING_ROOM:-on}"                     # on | off  (http://<tailscale-ip>:6769)
      MEETING_ROOM_TOKEN: "${MEETING_ROOM_TOKEN:-}"           # optional: open :6769/?token=<word>
    volumes:
      - ./home:/home/orca         # Orca data, AI logins, git/ssh config
      - ./workspace:/workspace    # your git projects
