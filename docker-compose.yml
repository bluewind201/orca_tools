# Paseo on the NAS. Personal values come from .env next to this file (see .env.example).
services:
  paseo:
    build: .
    image: paseo-nas:latest
    container_name: paseo
    restart: unless-stopped
    init: false            # tini is already the entrypoint
    ports:
      - "6767:6767"   # Paseo daemon + web UI (http://<tailscale-ip>:6767)
      - "6769:6769"   # AI 팀 회의실 page
    environment:
      TZ: Asia/Seoul
      PUID: "${PUID:-1026}"                                   # `id` in DSM SSH → uid
      PGID: "${PGID:-100}"                                    # `id` in DSM SSH → gid
      PASEO_PASSWORD: "${PASEO_PASSWORD:?set PASEO_PASSWORD in .env}"
      PASEO_HOSTNAMES: "${PASEO_HOSTNAMES:-}"                 # only for DNS names (e.g. nas.tailnet.ts.net); IPs work already
      MEETING_ROOM: "${MEETING_ROOM:-on}"                     # on | off
      MEETING_ROOM_TOKEN: "${MEETING_ROOM_TOKEN:-}"           # optional: open :6769/?token=<word>
    volumes:
      - ./paseo-home:/home/paseo  # Paseo data, AI logins (Claude/Codex/Gemini), git/gh config
      - ./workspace:/workspace    # your git projects (same folder Orca used)
